bio: |
  I am an Associate Professor at the University of Córdoba. I teach the courses 'Astrophysics and Cosmology' and 'Nuclear and Particle Physics' of the Bachelor's degree in Physics. My research focuses on the field of Cosmology, which unites these disciplines.
