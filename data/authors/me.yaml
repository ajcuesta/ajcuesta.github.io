      **Selected publications**

      - The clustering of galaxies in the SDSS-III Baryon Oscillation Spectroscopic Survey: baryon acoustic oscillations in the correlation function of LOWZ and CMASS galaxies in Data Release 12. <u>Cuesta, Antonio J.</u>; Vargas-Magana, Mariana; Beutler, Florian et al. (23 authors) *Monthly Notices of the Royal Astronomical Society*, Volume 457, Issue 2, 01 April 2016, Pages 1770-1785, https://doi.org/10.1093/mnras/stw066 (155 citations).
      - Calibrating the cosmic distance scale ladder: the role of the sound-horizon scale and the local expansion rate as distance anchors. <u>Antonio J. Cuesta</u>, Licia Verde, Adam Riess (Nobel laureate 2011), Raul Jimenez. *Monthly Notices of the Royal Astronomical Society*, Volume 448, Issue 4, 21 April 2015, Pages 3463-3471, https://doi.org/10.1093/mnras/stv261 (92 citations).
      - Neutrino mass limits: Robust information from the power spectrum of galaxy surveys. <u>Antonio J. Cuesta</u>, Viviana Niro, Licia Verde. *Physics of the Dark Universe*, Volume 13, 2016, Pages 77-86, https://doi.org/10.1016/j.dark.2016.04.005 (107 citations).
