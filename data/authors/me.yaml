      - Cosmology of an axion-like majoron. <u>A. J. Cuesta</u>, M. E. Gómez, J. I. Illana and M. Masip.  *Journal of Cosmology and Astroparticle Physics* 04 (2022) 009. https://doi.org/10.1088/1475-7516/2022/04/009 (9 citations).
  - role: Postdoctoral Researcher
