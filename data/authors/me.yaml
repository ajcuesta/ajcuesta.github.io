    summary: |
      Researcher in the Galaxy Clustering group of the Baryon Oscillation Spectroscopic Survey experiment (Sloan Digital Sky Survey III). Postdoc in Dr. [Nikhil Padmanabhan](https://en.wikipedia.org/wiki/Nikhil_Padmanabhan)'s group.


      **Selected publications**

      - Clustering of Sloan Digital Sky Survey III Photometric Luminous Galaxies: The Measurement, Systematics, and Cosmological Implications. Shirley Ho, <u>Antonio Cuesta</u>, Hee-Jong Seo, et al. (40 authors). *The Astrophysical Journal*, Volume 761, 14 https://doi.org/10.1088/0004-637X/761/1/14 (119 citations).
      - Measuring DA and H at z=0.35 from the SDSS DR7 LRGs using baryon acoustic oscillations. Xiaoying Xu, <u>Antonio J. Cuesta</u>, Nikhil Padmanabhan, Daniel J. Eisenstein, Cameron K. McBride. *Monthly Notices of the Royal Astronomical Society*, Volume 431, Issue 3, 21 May 2013, Pages 2834–2860, https://doi.org/10.1093/mnras/stt379 (191 citations).
