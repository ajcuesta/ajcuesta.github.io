role: Profesor Titular · Universidad de Córdoba
bio: |
  Soy Profesor Titular en la Universidad de Córdoba. Imparto las asignaturas 'Astrofísica y Cosmología' y 'Física Nuclear y de Partículas' del Grado de Física. Mi investigación se centra en el campo de la Cosmología, que une estas disciplinas.
interests:
  - Cosmología
  - Oscilaciones acústicas de bariones
  - Energía oscura y tensión de Hubble
  - Física de neutrinos
  - Física más allá del Modelo Estándar
