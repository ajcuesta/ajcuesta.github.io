      - Dynamical dark energy in light of the latest observations. Zhao, GB., Raveri, M., Pogosian, L. et al., incluyendo <u>Antonio J. Cuesta</u> (11/26 autores). *Nature Astronomy* 1, 627-632 (2017). https://doi.org/10.1038/s41550-017-0216-z (citado 441 veces).
      - Evidence for baryon acoustic oscillations from galaxy-ellipticity correlations. Kun Xu, Y. P. Jing, Gong-Bo Zhao & <u>Antonio J. Cuesta</u>. *Nature Astronomy* 7, 1259-1264 (2023). https://doi.org/10.1038/s41550-023-02035-4 (citado 21 veces).
      - Cosmology of an axion-like majoron. <u>A. J. Cuesta</u>, M. E. Gómez, J. I. Illana and M. Masip.  *Journal of Cosmology and Astroparticle Physics* 04 (2022) 009. https://doi.org/10.1088/1475-7516/2022/04/009 (citado 9 veces).
  - role: Investigador Postdoctoral
    org: Universitat de Barcelona
    org_url: https://web.ub.edu
    start: 2013-10-01
    end: 2017-01-01
    summary: |
      Investigador del grupo de Galaxy Clustering del experimento Baryon Oscillation Spectroscopic Survey del Sloan Digital Sky Survey III. Postdoc en el grupo de la Dra. [Licia Verde](https://es.wikipedia.org/wiki/Licia_Verde).

      **Publicaciones destacadas**

      - The clustering of galaxies in the SDSS-III Baryon Oscillation Spectroscopic Survey: baryon acoustic oscillations in the correlation function of LOWZ and CMASS galaxies in Data Release 12. <u>Cuesta, Antonio J.</u>; Vargas-Magana, Mariana; Beutler, Florian et al. (23 autores) *Monthly Notices of the Royal Astronomical Society*, Volume 457, Issue 2, 01 April 2016, Pages 1770-1785, https://doi.org/10.1093/mnras/stw066 (citado 155 veces).
      - Calibrating the cosmic distance scale ladder: the role of the sound-horizon scale and the local expansion rate as distance anchors. <u>Antonio J. Cuesta</u>, Licia Verde, Adam Riess (Nobel laureate 2011), Raul Jimenez. *Monthly Notices of the Royal Astronomical Society*, Volume 448, Issue 4, 21 April 2015, Pages 3463-3471, https://doi.org/10.1093/mnras/stv261 (citado 92 veces).
      - Neutrino mass limits: Robust information from the power spectrum of galaxy surveys. <u>Antonio J. Cuesta</u>, Viviana Niro, Licia Verde. *Physics of the Dark Universe*, Volume 13, 2016, Pages 77-86, https://doi.org/10.1016/j.dark.2016.04.005 (citado 107 veces).
  - role: Postdoctoral Research Associate
