      projects:
        items:
          - title: Oscilaciones acústicas de bariones y Grandes Cartografiados Astronómicos
            content: Estas ondas que se propagaron cuando el Universo estaba en forma de plasma se quedaron congeladas mucho antes de la formación de galaxias, con lo que la huella de dichas ondas quedó grabada en la estructura a gran escala del Universo. Son excelentes medidoras de distancias cosmológicas, permitiendo medir distancias de miles de millones de años luz con una precisión menor al 1%. De hecho, experimentos actuales como DESI o Euclid están realizando cartografiados astronómicos que llegan hasta miles de millones de años atrás en el tiempo, permitiendo reconstruir la historia de expansión del Universo.
            image: /images/bao.png
            featured:
              name: Wikipedia
              link:  https://en.wikipedia.org/wiki/Baryon_acoustic_oscillations
          - title: La escalera cósmica de distancias y la Tensión de Hubble
            content: Medir distancias es todo un reto en Cosmología. Para ello necesitamos conocer muy bien las propiedades de distintos objetos astrofísicos que podamos observar a grandes distancias, como estrellas variables cefeidas, o supernovas de tipo Ia, así como calibrar muy bien medidas geométricas de distancias como los paralajes estelares o los máseres de galaxias cercanas. En el futuro cercano, la medida de cuásares mediante efecto gravitacional gracias al observatorio Vera C. Rubin así como la detección de ondas gravitacionales de las fusiones de estrellas de neutrones y/o agujeros negros, permitirán cuantificar mejor la Tensión de Hubble y así avanzar en el conocimiento de las propiedades de la misteriosa energía oscura.
            image: /images/ladder.png
            featured:
              name: Wikipedia
              link:  https://en.wikipedia.org/wiki/Cosmic_distance_ladder
          - title: La física del sector de los neutrinos y sus efectos cosmológicos
            content: El sector de los neutrinos es el más desconocido del Modelo Estándar de la física de partículas y puede contener la clave de la asimetría materia-antimateria que explique nuestra propia existencia. Aunque los experimentos realizados en 1998 y 2001 revelaron que los neutrinos tienen masa, el origen de dicha masa (millones de veces menor que la masa del electrón), así como su valor exacto, son todavía desconocidos. Las medidas cosmológicas permiten poner cotas restrictivas en el valor de la masa de los neutrinos, complementando los experimentos de física de partículas como Katrin. Y además, experimentos como Ptolemy intentarán detectar el fondo cósmico de neutrinos, aportando información sobre cómo era el Universo solamente 1 segundo después del Big Bang.
            image: /images/neutrino.png
            featured:
              name: Wikipedia
              link:  https://en.wikipedia.org/wiki/Cosmic_neutrino_background
